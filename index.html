<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#15191d"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="残灯の深淵"><meta name="description" content="敵を知り、退路を選び、最後の灯を守る。20階の戦術ローグライク。"><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icons/apple-touch-icon.png"><link rel="icon" href="./icons/icon.svg"><link rel="stylesheet" href="./style.css"><title>残灯の深淵</title></head><body>
<main class="game"><header><div class="brand"><span class="seal">残</span><div><h1>残灯の深淵 <small id="version">v1.0.0</small></h1><div class="subtitle">ZANTO · EVERY TURN MATTERS</div></div></div><button id="help" class="icon-button" aria-label="遊び方・記録・設定">?</button></header>
<section class="stats" aria-label="探索者の状態"><div class="depth"><small>DEPTH</small><strong id="floor">01 <span>/ 20</span></strong></div><div class="health"><div class="statline"><span>生命 <b id="hp"></b></span><span id="food"></span></div><div class="meter"><i id="hpbar"></i></div><div class="statline subtle"><span id="loadout"></span><span id="ammo"></span></div></div></section>
<div id="status-row" class="status-row"></div>
<section class="board"><div class="map-heading"><span id="area"></span><span id="turn"></span></div><canvas id="map" aria-label="戦場。タップで敵や床を調べる"></canvas><div id="ground" class="ground" hidden></div><div class="map-legend"><span>● あなた</span><span class="danger">斜線：攻撃予告</span><button id="overview">全体図 ↗</button></div></section>
<div id="aim" class="aim" hidden><span id="aim-text"></span><div><button id="aim-confirm" class="accent">実行</button><button id="aim-cancel">取消</button></div></div>
<div id="threats" class="threats" aria-label="見える敵"></div><section id="log" class="log" aria-live="polite"></section>
<section class="controls"><div class="dpad" aria-label="移動"><button data-move="-1,-1" aria-label="左上">↖</button><button data-move="0,-1" aria-label="上">↑</button><button data-move="1,-1" aria-label="右上">↗</button><button data-move="-1,0" aria-label="左">←</button><button id="wait" class="wait">待つ</button><button data-move="1,0" aria-label="右">→</button><button data-move="-1,1" aria-label="左下">↙</button><button data-move="0,1" aria-label="下">↓</button><button data-move="1,1" aria-label="右下">↘</button></div><div class="action-grid"><button id="guard">◇ 防御</button><button id="shoot">↗ 射撃</button><button id="bag">道具 <span id="bagcount"></span></button><button id="skills">技能 <span id="points"></span></button><button id="stairs" class="stairs">▤ 階段を降りる</button></div></section>
<footer><span id="save">端末内保存</span><span id="offline">オフライン準備中</span></footer></main>
<dialog id="modal"><div class="modal-top"><span class="subtitle">ZANTO / FIELD NOTES</span><button id="close" aria-label="閉じる">×</button></div><div id="body"></div></dialog>
<script type="module" src="./app.js"></script></body></html>
